[project]
name = "hl-mcp"
version = "0.1.0"
description = "Read-only MCP server and Claude trading copilot for Hyperliquid's public info API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]



[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
